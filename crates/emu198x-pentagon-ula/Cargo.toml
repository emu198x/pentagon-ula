[package]
name = "emu198x-pentagon-ula"
description = "Pentagon ULA — Russian Spectrum clone, no contention, 3.5 MHz CPU and 48.83 Hz frames"
edition.workspace = true
# Independently versioned, not the workspace lockstep version: this is a
# published crate whose version communicates *its* changes to consumers, so it
# bumps when it changes rather than on every Emu198x suite release. Started at
# 0.1.0 when it took the emu198x- prefix to publish.
version = "0.2.1"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["zx-spectrum", "ula", "pentagon", "video", "emulator"]
categories = ["emulators"]

[dependencies]
serde = { workspace = true }
emu198x-bus-sinclair-zx-spectrum = "0.1.1"
emu198x-sinclair-zx-spectrum-ula = "0.2.0"

[lints]
workspace = true
